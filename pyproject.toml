[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gena-optimizer"
dynamic = ["version"]
description = "Small, composable tools for shrinking LLM prompts and context: prompt hygiene and conversation compaction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "gena-optimizer contributors" }]
keywords = ["llm", "prompt", "context", "tokens", "compaction", "summarization", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = ["build", "mypy", "pytest", "ruff", "twine"]

[tool.hatch.version]
path = "src/gena_optimizer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gena_optimizer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "scripts", "README.md", "CONTRIBUTING.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tiktoken"
ignore_missing_imports = true
